# =============================================================================
# Uviewer-Legado CI —— 按 README「编译方法」构建应用
# -----------------------------------------------------------------------------
# 触发：push / PR 到开发主分支 Legado-DEV（默认推荐）、稳定分支 Legado-Builtin、
#       上游镜像 main（见 README「分支说明」）。
# 运行器：windows-latest（必需——WinUI 3 + WindowsAppSDK 依赖 Windows SDK，
#         且主程序目标框架为 net10.0-windows10.0.26100.0）。
# 构建命令严格对齐 README：
#   dotnet build Uviewer/Uviewer.csproj -c Debug -p:Platform=x64
# 唯一必要偏离：禁用 MSIX 打包（-p:EnableMsixTooling=false -p:WindowsPackageType=None）。
#   原因：签名证书 Uviewer_TemporaryKey.pfx 被 .gitignore 排除、未入库，CI 干净检出
#   无证书会导致 AppxPackageSigning 失败；CI 目标是「验证应用可编译」，无需出安装包。
#   若日后要出正式 MSIX，可将证书作为 GitHub Secret 注入后去掉这两个开关。
# 说明：Legado 引擎不独立成库，内置于 Uviewer/Services/Legado/，构建主程序即构建引擎；
#       测试/基准在 README 中标注为「可选，面向开发者」，不纳入用户构建产物。
# =============================================================================
name: CI

on:
  push:
    branches: [ Legado-DEV, Legado-Builtin, main ]
  pull_request:
    branches: [ Legado-DEV, Legado-Builtin, main ]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # --- .NET 10 SDK（与 global.json 一致；README 环境要求 .NET SDK 10.0）---
      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # --- 缓存 NuGet 包，加速恢复 ---
      - name: 缓存 NuGet 包
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Uviewer/Uviewer/Uviewer.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # --- 恢复主程序依赖（README 构建目标即 Uviewer/Uviewer.csproj）---
      - name: 恢复依赖
        run: dotnet restore Uviewer/Uviewer.csproj

      # --- 构建 Uviewer（Debug x64，严格对齐 README「编译方法」）---
      - name: 构建 Uviewer（Debug x64）
        run: >
          dotnet build Uviewer/Uviewer.csproj
          -c Debug -p:Platform=x64
          --no-restore
          -p:EnableMsixTooling=false
          -p:WindowsPackageType=None

      # --- 上传构建产物（松散输出，仅作编译可过性校验；非 MSIX 安装包）---
      - name: 上传构建产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Uviewer-build
          path: Uviewer/Uviewer/bin/x64/Debug/
          if-no-files-found: warn
